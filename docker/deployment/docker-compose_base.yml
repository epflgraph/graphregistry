# Minimal Docker Compose deployment for GraphRegistry.
#
# This deploys only the GraphRegistry API. No reverse proxy, no SSL termination,
# and no monitoring stack are included. Use this as a starting point for local
# development or when you handle TLS and monitoring outside this compose file.
#
# Before starting:
#   1. Copy config examples to ./config/ and fill in your values.
#   2. Adjust the host port mapping below if 0493 is already in use.

services:
  graphregistry:
    image: epflgraph/graphregistry:latest
    container_name: graphregistry-app
    restart: unless-stopped
    ports:
      - "0493:0493"
    environment:
      GRAPHREGISTRY_ROLE: api
      API_HOST: 0.0.0.0
      API_PORT: 0493
      API_WORKERS: 1
      API_PROXY_HEADERS: 1
      API_FORWARDED_ALLOW_IPS: "*"
    volumes:
      - ./config:/app/config:ro
