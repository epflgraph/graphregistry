[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphregistry"
version = "0.1.0"
description = "EPFL Graph Registry"
requires-python = ">=3.10"
dependencies = [
    "uvicorn",
    "fastapi",
    "sqlalchemy",
    "tqdm",
    "loguru",
    "rich",
    "elasticsearch==8.15.1",
    "Levenshtein",
    "requests",
    "termcolor",
    "numpy",
    "pandas",
    "tabulate",
    "pyyaml",
    "pymysql",
    "flatten_dict",
    "dictdiffer",
    "pytest",
    "openai",
    # Git dependency (PEP 508 syntax)
    "graphdb-client @ git+https://github.com/epflgraph/graphdb-client.git",
    "graphes-client @ git+https://github.com/epflgraph/graphes-client.git",
    "graphai-client @ git+https://github.com/epflgraph/graphai-client.git",
]

[project.scripts]
# CLI entrypoint for the graphregistry package
graphregistry = "graphregistry.entrypoints.cli.main:main"

# Tell setuptools what to package (and what to ignore)
[tool.setuptools.packages.find]
include = ["graphregistry*"]
exclude = [
    "config*",
    "database*",
    "resources*",
    "node_modules*",
    "scripts*",
    "tests*",
]

# Pytest configuration for the project
[tool.pytest.ini_options]
markers = [
    "integration: tests that hit real external systems (DB, APIs, etc.)",
    "e2e: end-to-end tests hitting real systems (DB, CLI, etc.)"
]