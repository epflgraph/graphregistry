description:
  en:
    shortDescription: >-
      Core service of the EPFL Graph Platform that ingests academic data and
      builds the knowledge graph behind GraphSearch and GraphChat.
    longDescription: >-
      **Graph Registry** is the first layer of the
      [EPFL Graph Platform](https://github.com/epflgraph/graphplatform). It
      ingests data about academic entities (courses, lectures, exercises,
      publications and other resources) in JSON format through an ETL
      pipeline, and turns it into a **knowledge graph** that feeds the
      GraphSearch and GraphChat applications.


      Data can be added through direct JSON file imports or through a REST
      API. The knowledge graph construction steps are run from a command
      line interface. The Registry relies on Graph AI for semantic analysis
      and concept detection, and can optionally use a large language model
      to further enrich raw data.


      It can be deployed with Docker or installed as a Python package.
    documentation: "https://epflgraph.github.io/graphregistry/"
    features:
      - Import of academic data from JSON files or through a REST API
      - ETL pipeline that cleans, links and stores entities in a relational database
      - Knowledge graph construction linking entities to ontology concepts
      - Indexing of the knowledge graph for search and recommendation
      - Separate development and production data environments
      - Optional enrichment of raw data with a large language model
      - Command line interface for running and monitoring each step
      - Docker image for simple deployment

